<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111b2a">
<title>红包雷达 Lite</title>
<style>
:root{color-scheme:dark;font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1726;color:#eef4fe}
*{box-sizing:border-box}body{margin:0;padding:16px 12px 42px}main{max-width:640px;margin:0 auto}h1{font-size:24px;margin:0}h2{font-size:16px;margin:0 0 10px}p{margin:8px 0;color:#b7c7d9}.title{display:flex;gap:11px;align-items:center;margin:4px 3px 18px}.logo{height:44px;width:44px;border-radius:12px;display:grid;place-items:center;background:#173d34;color:#88f2c7;font-size:30px;font-weight:700}.sub{font-size:12px;color:#adc2d7}.card{background:#19283d;border:1px solid #31445c;border-radius:15px;padding:15px;margin-bottom:12px}.callout{background:#31402f;color:#dfedcf;border-radius:11px;padding:10px 12px;font-size:12px;line-height:1.6}.badnotice{background:#503638;color:#ffe3e4}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{background:#344052;color:#d8e5f5;font-size:12px;border-radius:30px;padding:3px 10px}.pill.live{background:#104638;color:#91edbc}.pill.error{background:#69363c;color:#ffd0d3}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}button{border:0;min-height:44px;border-radius:10px;padding:9px 8px;cursor:pointer;font:700 14px inherit;background:#50d6a1;color:#073121}button.alt{background:#33465f;color:#edf5ff}button:disabled{opacity:.44}.wide{grid-column:1/-1}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.metric{background:#111d30;border-radius:10px;padding:10px;font-size:12px;color:#bdcfe2}.metric b{font-size:17px;color:#f6fafc;display:block;margin-top:3px;font-variant-numeric:tabular-nums}.meter{margin-top:12px;height:7px;border-radius:10px;background:#0e1a2b;overflow:hidden}.meter>div{height:100%;background:#64e2b0;width:0}.panel{background:#101c2e;border:1px solid #30445e;border-radius:9px;padding:12px;min-height:65px;overflow-wrap:anywhere}.hint{font-size:12px;color:#aebfd3;line-height:1.6}label{display:block;color:#b6c9dc;font-size:12px;margin-top:11px;margin-bottom:5px}input,textarea{width:100%;background:#101c2d;border:1px solid #415774;color:#f0f8ff;border-radius:9px;padding:10px;font:inherit;min-width:0}input[type=number]{width:110px}ul.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}li{border-bottom:1px solid #344259;padding:7px 0;color:#c8d6ea;font-size:12px}time{color:#8eabc4;margin-right:10px}li.alert{color:#88efbf}li.error{color:#ffb7b8}.help{color:#b9cde0;font-size:12px;line-height:1.8}.help a{color:#97cfff}.footer{font-size:12px;color:#92a9be}
</style>
</head>
<body><main>
<header class="title"><div class="logo">⌁</div><div><h1>红包雷达 <span style="color:#81eac1">Lite</span></h1><div class="sub">实时语音监听 · 本地识别</div></div></header>
<section class="card"><div class="top"><h2>运行状态</h2><span id="state" class="pill">未初始化</span></div>
<div id="explain" class="callout">点击“加载中文模型”，完成后启动监听。</div>
<div class="metrics"><div class="metric">持续监听时间<b id="uptime">00:00:00</b></div><div class="metric">声音输入<b id="micStatus">未开启</b></div><div class="metric">识别模型<b id="modelStatus">未加载</b></div><div class="metric">识别到的红包事件<b id="count">0</b></div></div>
<div class="meter"><div id="volume"></div></div>
<label for="modelURL">模型加载</label><div class="hint">首次打开需要下载中文识别模型。</div>
<div class="buttons"><button id="load" class="alt wide">① 加载中文模型（首次约 42MB）</button><button id="start" disabled>② 开始持续监听</button><button id="stop" class="alt" disabled>停止监听</button><button id="test" class="alt">测试警报声</button><button id="simulate" class="alt">模拟口令</button></div>
<p class="hint">保持本网页在前台并尽量亮屏。其他设备可正常播放直播音频。</p>
</section>
<section class="card"><h2>实时语音识别结果</h2><div id="transcript" class="panel">等待语音识别引擎初始化……</div><p class="hint">本地语音识别。首次使用需要联网获取模型和识别库。</p></section>
<section class="card"><h2>关键词规则</h2>
<label for="pre">预警词，多个词以逗号分隔</label><input id="pre" value="所有女生注意,所有钻粉,钻粉宝宝,宝宝们注意">
<label for="alarm">强提醒词</label><input id="alarm" value="红包雨,领红包,发红包,抢红包,红包来了,红包开始">
<label for="cool">同类警报冷却（秒）</label><input id="cool" type="number" value="8" min="3" max="90">
</section>
<section class="card"><div class="top"><h2>运行日志</h2><button id="copy" class="alt" style="min-height:34px;padding:6px 10px;font-size:12px">复制日志</button></div><ul id="logs" class="log"></ul></section>

</main>
<script src="https://cdn.jsdelivr.net/npm/vosk-browser@0.0.5/dist/vosk.js"></script>
<script>
'use strict';
const el=(id)=>document.getElementById(id);
const events=[];let model=null,recognizer=null,loading=false,active=false,starting=false,stream=null,ctx=null,node=null,source=null,silence=null,wakeLock=null,ticker=null,beginTime=0,eventCount=0,beepCtx=null,frames=0,volumeMax=0,lastFrameAt=0,lastText='',lastTextPaint=0;
const lastAlarm={warn:0,alert:0};
function log(text,kind=''){events.unshift({at:new Date().toLocaleTimeString('zh-CN',{hour12:false}),text,kind});events.length=Math.min(events.length,60);el('logs').replaceChildren(...events.map(x=>{const li=document.createElement('li');li.className=x.kind;const t=document.createElement('time');t.textContent=x.at;li.append(t,document.createTextNode(x.text));return li;}));}
function status(msg,kind='',detail=''){el('state').textContent=msg;el('state').className='pill'+(kind?' '+kind:'');if(detail)el('explain').textContent=detail;}
function controls(){el('load').disabled=loading||active||starting;el('start').disabled=loading||active||starting||!model;el('stop').disabled=!active&&!starting;}
function normalize(s){return String(s||'').replace(/[\s\u200b，。？！、:：,!.\-]+/g,'').toLowerCase();}
function keys(id){return el(id).value.split(/[，,、;；\n]+/).map(x=>normalize(x)).filter(Boolean);}
function unlockSound(){try{if(!beepCtx)beepCtx=new (window.AudioContext||window.webkitAudioContext)();if(beepCtx.state==='suspended')beepCtx.resume().catch(()=>{});}catch(err){log('声音播放器不可用：'+err.message,'error');}}
function beep(type='alert'){unlockSound();if(!beepCtx)return;const ts=type==='alert'?[860,1080,860,1080]:[640,770],c=beepCtx;ts.forEach((frequency,i)=>{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+.02+i*.19;o.frequency.value=frequency;o.type='sine';g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.16);});try{navigator.vibrate?.(type==='alert'?[180,100,180]:100)}catch(e){}}
function detect(text){const clean=normalize(text),alarm=keys('alarm').find(s=>clean.includes(s)),warn=keys('pre').find(s=>clean.includes(s));const kind=alarm?'alert':warn?'warn':null;if(!kind)return;const now=Date.now(),cool=Math.max(3,Number(el('cool').value)||8)*1000;if(now-lastAlarm[kind]<cool)return;lastAlarm[kind]=now;if(kind==='alert')eventCount++;el('count').textContent=eventCount;beep(kind);log((kind==='alert'?'红包强提醒':'口令预警')+'：'+(alarm||warn),'alert');}
function observed(text){if(!active)return;const v=String(text||'').trim();if(!v)return;const now=Date.now();if(v!==lastText||now-lastTextPaint>700){el('transcript').textContent=v;lastText=v;lastTextPaint=now;}detect(v);}
function explainErr(e){return (e&&e.message)||String(e);}
async function loadModel(){if(model||loading)return;if(!window.isSecureContext){status('HTTPS 必需','error','请通过 HTTPS 网站打开，不要直接从下载目录打开 HTML。');return;}if(!window.Vosk||typeof Vosk.createModel!=='function'){status('识别库加载失败','error','语音识别库暂时无法加载，请检查网络。');return;}
loading=true;controls();el('modelStatus').textContent='加载中';status('正在加载模型','', '正在下载和加载中文模型，请保持网页打开。');log('开始加载中文离线模型');try{model=await Vosk.createModel('./model.tar.gz');try{model.setLogLevel?.(-1)}catch(e){}el('modelStatus').textContent='已就绪';status('模型已就绪','live','现在可以点击“开始持续监听”。');log('中文模型加载成功');}
catch(e){el('modelStatus').textContent='加载失败';status('模型加载失败','error','模型不可用，请检查网络并稍后重试。'+explainErr(e));log('模型加载失败：'+explainErr(e),'error');}finally{loading=false;controls();}}
async function askWakeLock(){if(!('wakeLock'in navigator)||document.hidden)return;try{wakeLock=await navigator.wakeLock.request('screen');}catch(e){log('无法锁定亮屏：'+explainErr(e),'error');}}
function formatTime(s){let h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return [h,m,ss].map(x=>String(x).padStart(2,'0')).join(':');}
function heartbeat(){if(!active)return;el('uptime').textContent=formatTime(Math.floor((Date.now()-beginTime)/1000));const track=stream?.getAudioTracks()[0];if(!track||track.readyState!=='live'){stop('麦克风输入已断开');return;}if(ctx?.state!=='running'){status('音频已暂停','error','浏览器暂停了音频处理。请将本页放回前台并手动恢复。');el('micStatus').textContent='暂停';return;}if(Date.now()-lastFrameAt>4000){status('音频流疑似停滞','error','采集服务未继续收到音频帧，请检查是否切换到了后台、锁屏或系统回收了页面。');el('micStatus').textContent='无数据';return;}el('micStatus').textContent='正常采集中';}
async function start(){if(active||starting||!model)return;if(!navigator.mediaDevices?.getUserMedia){status('麦克风不可用','error','请使用 HTTPS，确认浏览器开放 getUserMedia。');return;}
starting=true;controls();unlockSound();status('请求麦克风中');try{
stream=await navigator.mediaDevices.getUserMedia({video:false,audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true,channelCount:1,sampleRate:16000}});
recognizer=new model.KaldiRecognizer();recognizer.on('partialresult',msg=>observed(msg?.result?.partial));recognizer.on('result',msg=>observed(msg?.result?.text));
ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();source=ctx.createMediaStreamSource(stream);node=ctx.createScriptProcessor(4096,1,1);silence=ctx.createGain();silence.gain.value=0;
node.onaudioprocess=(ev)=>{if(!active)return;try{recognizer.acceptWaveform(ev.inputBuffer);frames++;lastFrameAt=Date.now();if(frames%5===0){const d=ev.inputBuffer.getChannelData(0);let sum=0;for(let i=0;i<d.length;i++)sum+=d[i]*d[i];const rms=Math.sqrt(sum/d.length);volumeMax=Math.max(rms,volumeMax*.85);el('volume').style.width=Math.round(Math.min(100,rms*550))+'%';}}catch(e){log('模型处理音频异常：'+explainErr(e),'error');}};
const outputSilent=()=>{};source.connect(node);node.connect(silence);silence.connect(ctx.destination);
active=true;beginTime=Date.now();lastFrameAt=Date.now();el('micStatus').textContent='正常采集中';status('正在持续监听','live','麦克风音频正在持续传给本地 Vosk 引擎，无需等待 Web Speech 会话自动结束或重新授权。');log('开始本地持续监听');stream.getAudioTracks().forEach(t=>t.addEventListener('ended',()=>{if(active)stop('麦克风被系统终止')}));ticker=setInterval(heartbeat,1000);await askWakeLock();
}catch(e){const message='启动失败：'+explainErr(e);status('启动失败','error',message);log(message,'error');await release();}
finally{starting=false;controls();}}
async function release(){active=false;if(ticker){clearInterval(ticker);ticker=null;}if(node){node.onaudioprocess=null;try{node.disconnect()}catch(e){}}if(source){try{source.disconnect()}catch(e){}}if(silence){try{silence.disconnect()}catch(e){}}if(stream){stream.getTracks().forEach(t=>t.stop())}if(ctx){try{await ctx.close()}catch(e){}}try{recognizer?.remove()}catch(e){}try{await wakeLock?.release()}catch(e){}stream=null;ctx=null;source=null;node=null;silence=null;recognizer=null;wakeLock=null;el('volume').style.width='0%';el('micStatus').textContent='未开启';}
async function stop(reason='已手动停止'){if(!active&&!starting)return;await release();status('已停止','',reason);log(reason);controls();}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active){log('页面进入后台：Android 可能暂停收音与 WASM 推理','error');status('后台可能暂停','error','网页切到后台后无法保证继续收音。请保持本页处于前台。');}else if(active){if(ctx?.state==='suspended')ctx.resume().catch(e=>log('恢复失败：'+e.message,'error'));askWakeLock().catch(()=>{});status('正在持续监听','live','已返回前台，正在检查音频输入。');}});
window.addEventListener('pagehide',()=>{if(active)release().catch(()=>{});});
el('load').addEventListener('click',loadModel);el('start').addEventListener('click',start);el('stop').addEventListener('click',()=>stop());el('test').addEventListener('click',()=>{beep('alert');log('测试强警报声');});el('simulate').addEventListener('click',()=>{beep('warn');el('transcript').textContent='所有钻粉宝宝领红包啦';detect('所有钻粉宝宝领红包啦');log('模拟口令输入');});el('copy').addEventListener('click',async()=>{const t=events.slice().reverse().map(x=>x.at+' '+x.text).join('\n');try{await navigator.clipboard.writeText(t);log('日志已复制')}catch(e){log('复制失败：'+e.message,'error')}});
if(!window.isSecureContext)status('当前不是安全网页','error','getUserMedia 要求 HTTPS 或合规的安全上下文。请用 HTTPS 网站打开本页面。');else if(!navigator.mediaDevices?.getUserMedia)status('麦克风接口不可用','error','当前网页无法访问麦克风，请检查浏览器和网页来源。');else status('等待加载中文模型','','请先加载中文识别模型。');
controls();
</script>
</body></html>
